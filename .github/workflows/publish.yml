name: Publish Flatpak Repository

run-name: Publish ${{ inputs.release_tag }} from dart run ${{ inputs.source_run_id || 'manual' }}.${{ inputs.source_run_attempt || '1' }}

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing dart-flutter-demo GitHub Release tag
        required: true
        type: string
      source_run_id:
        description: Source dart-flutter-demo Actions run ID
        required: false
        type: string
      source_run_attempt:
        description: Source dart-flutter-demo Actions run attempt
        required: false
        type: string

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: flatpak-repository-production
  cancel-in-progress: false

env:
  APP_ID: io.github.vincentzyuapps.dartflutterdemo
  SOURCE_REPOSITORY: VincentZyuApps/dart-flutter-demo
  STATE_BRANCH: repo-state

jobs:
  resolve:
    name: Resolve publication request
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      bundle: ${{ steps.release.outputs.bundle }}
      release_tag: ${{ steps.release.outputs.tag }}
      should_publish: ${{ steps.release.outputs.should_publish }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Resolve and validate Release
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id || '' }}
          SOURCE_RUN_ATTEMPT: ${{ inputs.source_run_attempt || '1' }}
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z]+)*$ ]]; then
            echo "Invalid Release tag: $RELEASE_TAG" >&2
            exit 1
          fi
          if [[ -n "$SOURCE_RUN_ID" && ! "$SOURCE_RUN_ID" =~ ^[0-9]+$ ]]; then
            echo "Invalid source Actions run ID: $SOURCE_RUN_ID" >&2
            exit 1
          fi
          if [[ ! "$SOURCE_RUN_ATTEMPT" =~ ^[1-9][0-9]*$ ]]; then
            echo "Invalid source Actions run attempt: $SOURCE_RUN_ATTEMPT" >&2
            exit 1
          fi
          VERSION="${RELEASE_TAG#v}"
          BUNDLE="dart-flutter-demo-linux-x64-v${VERSION}.flatpak"
          RELEASE_JSON="$(gh api "repos/${SOURCE_REPOSITORY}/releases/tags/${RELEASE_TAG}")"
          test "$(jq -r '.draft' <<< "$RELEASE_JSON")" = "false"
          jq -e --arg name "$BUNDLE" \
            'any(.assets[]; .name == $name)' <<< "$RELEASE_JSON" >/dev/null
          jq -e \
            'any(.assets[]; .name == "flatpak-publish-request.json")' \
            <<< "$RELEASE_JSON" >/dev/null
          gh release download "$RELEASE_TAG" \
            --repo "$SOURCE_REPOSITORY" \
            --pattern flatpak-publish-request.json \
            --dir request
          jq -e \
            --arg app_id "$APP_ID" \
            --arg bundle "$BUNDLE" \
            --arg release_tag "$RELEASE_TAG" \
            '.schema_version == 1 and
             .app_id == $app_id and
             .arch == "x86_64" and
             .branch == "stable" and
             .bundle == $bundle and
             .release_tag == $release_tag and
             .repository == "VincentZyuApps/flatpak-repo"' \
            request/flatpak-publish-request.json >/dev/null
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "bundle=$BUNDLE" >> "$GITHUB_OUTPUT"
          echo "should_publish=true" >> "$GITHUB_OUTPUT"

  publish:
    name: Sign and update repository
    needs: resolve
    if: needs.resolve.outputs.should_publish == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: flatpak-production
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Install Flatpak repository tools
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak ostree

      - name: Download versioned Flatpak bundle
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.resolve.outputs.release_tag }}
          BUNDLE: ${{ needs.resolve.outputs.bundle }}
        run: |
          set -euo pipefail
          mkdir -p incoming
          curl --fail --location --retry 5 --retry-all-errors \
            "https://github.com/${SOURCE_REPOSITORY}/releases/download/${RELEASE_TAG}/${BUNDLE}" \
            --output "incoming/${BUNDLE}"
          test -s "incoming/${BUNDLE}"
          sha256sum "incoming/${BUNDLE}"

      - name: Restore persistent repository state
        shell: bash
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --heads origin "$STATE_BRANCH" >/dev/null; then
            git fetch origin "$STATE_BRANCH:refs/remotes/origin/$STATE_BRANCH"
            git worktree add -B "$STATE_BRANCH" state "refs/remotes/origin/$STATE_BRANCH"
          else
            git worktree add --orphan -b "$STATE_BRANCH" state
          fi
          if [[ ! -f state/repo/config ]]; then
            mkdir -p state/repo
            ostree init --repo=state/repo --mode=archive-z2
          fi
          # Git cannot preserve empty OSTree directories on repo-state.
          mkdir -p state/repo/refs/remotes

      - name: Import protected signing key
        shell: bash
        env:
          PRIVATE_KEY: ${{ secrets.FLATPAK_GPG_PRIVATE_KEY }}
          PASSPHRASE: ${{ secrets.FLATPAK_GPG_PASSPHRASE }}
          EXPECTED_KEY: ${{ vars.FLATPAK_GPG_KEY_ID }}
        run: |
          set -euo pipefail
          GNUPGHOME="$RUNNER_TEMP/flatpak-gnupg"
          PRIVATE_KEY_FILE="$RUNNER_TEMP/flatpak-private.asc"
          PASSPHRASE_FILE="$RUNNER_TEMP/flatpak-passphrase"
          install -d -m 0700 "$GNUPGHOME"
          printf '%s\n' "$PRIVATE_KEY" > "$PRIVATE_KEY_FILE"
          printf '%s' "$PASSPHRASE" > "$PASSPHRASE_FILE"
          chmod 0600 "$PRIVATE_KEY_FILE" "$PASSPHRASE_FILE"
          gpg --homedir "$GNUPGHOME" --batch --import "$PRIVATE_KEY_FILE"
          ACTUAL_KEY="$(
            gpg --homedir "$GNUPGHOME" --batch --with-colons \
              --fingerprint "$EXPECTED_KEY" |
              awk -F: '$1 == "fpr" { print $10; exit }'
          )"
          test "$ACTUAL_KEY" = "$EXPECTED_KEY"
          gpg --homedir "$GNUPGHOME" --batch --yes \
            --pinentry-mode loopback --passphrase-file "$PASSPHRASE_FILE" \
            --local-user "$EXPECTED_KEY" --output "$RUNNER_TEMP/unlock.sig" \
            --detach-sign /dev/null
          echo "GNUPGHOME=$GNUPGHOME" >> "$GITHUB_ENV"
          echo "PASSPHRASE_FILE=$PASSPHRASE_FILE" >> "$GITHUB_ENV"
          echo "SIGNING_KEY=$EXPECTED_KEY" >> "$GITHUB_ENV"

      - name: Sign and update stable repository
        shell: bash
        env:
          BUNDLE: ${{ needs.resolve.outputs.bundle }}
        run: |
          set -euo pipefail
          flatpak build-import-bundle \
            --gpg-sign="$SIGNING_KEY" \
            --gpg-homedir="$GNUPGHOME" \
            --update-appstream \
            state/repo "incoming/$BUNDLE"
          flatpak build-update-repo \
            --title="dart-flutter-demo" \
            --comment="Signed stable Flatpak repository" \
            --description="Self-hosted Flatpak updates for dart-flutter-demo" \
            --homepage="https://github.com/$SOURCE_REPOSITORY" \
            --default-branch=stable \
            --gpg-import=keys/flatpak-repo-signing-public.asc \
            --gpg-sign="$SIGNING_KEY" \
            --gpg-homedir="$GNUPGHOME" \
            --generate-static-deltas \
            --prune \
            --prune-depth=2 \
            state/repo

      - name: Render repository descriptors and page
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/render_repository_files.py \
            --output-directory state \
            --version "${{ needs.resolve.outputs.version }}" \
            --public-key keys/flatpak-repo-signing-public.asc \
            --fingerprint "$SIGNING_KEY"

      - name: Verify signed repository locally
        shell: bash
        run: |
          set -euo pipefail
          test -s state/repo/summary
          test -s state/repo/summary.sig
          test -s state/dart-flutter-demo.flatpakrepo
          test -s state/dart-flutter-demo.flatpakref
          test -s state/repository.json
          test -f state/.nojekyll
          ISOLATED_HOME="$RUNNER_TEMP/flatpak-client-home"
          ISOLATED_DATA="$RUNNER_TEMP/flatpak-client-data"
          mkdir -p "$ISOLATED_HOME" "$ISOLATED_DATA"
          HOME="$ISOLATED_HOME" XDG_DATA_HOME="$ISOLATED_DATA" \
            flatpak remote-add --user --if-not-exists \
              --gpg-import=keys/flatpak-repo-signing-public.asc \
              local-test "file://$PWD/state/repo"
          EXPECTED_REF="$APP_ID"$'\t'"stable"$'\t'"x86_64"
          HOME="$ISOLATED_HOME" XDG_DATA_HOME="$ISOLATED_DATA" \
            flatpak remote-ls --user --columns=application,branch,arch local-test |
            grep -Fqx "$EXPECTED_REF"

      - name: Persist generated repository state
        shell: bash
        run: |
          set -euo pipefail
          git -C state config user.name github-actions[bot]
          git -C state config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git -C state add --all
          if git -C state diff --cached --quiet; then
            echo "Repository state is unchanged."
          else
            git -C state commit -m "chore(repo): publish ${{ needs.resolve.outputs.release_tag }}"
            git -C state push origin "$STATE_BRANCH"
          fi

      - name: Prepare Pages snapshot
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p pages
          rsync -a --exclude='.git' state/ pages/
          test ! -e pages/.git

      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: pages

  deploy:
    name: Deploy GitHub Pages
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

  verify-public:
    name: Verify public signed repository
    needs: deploy
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Install Flatpak client
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak

      - name: Wait for Pages and verify GPG-enabled remote
        shell: bash
        run: |
          set -euo pipefail
          BASE_URL="https://vincentzyuapps.github.io/flatpak-repo"
          curl --fail --location --retry 12 --retry-delay 5 --retry-all-errors \
            "$BASE_URL/repository.json" --output repository.json
          curl --fail --location --retry 12 --retry-delay 5 --retry-all-errors \
            "$BASE_URL/repo/summary" --output summary
          test -s repository.json
          test -s summary
          flatpak remote-add --user --if-not-exists \
            dart-flutter-demo "$BASE_URL/dart-flutter-demo.flatpakrepo"
          EXPECTED_REF="$APP_ID"$'\t'"stable"$'\t'"x86_64"
          flatpak remote-ls --user --columns=application,branch,arch \
            dart-flutter-demo |
            grep -Fqx "$EXPECTED_REF"
